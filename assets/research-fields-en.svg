<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Inorganic materials laboratory research directions</title>
  <desc id="desc">A visual map of five research directions: rare-earth extraction, hydrometallurgy, environmental nanomaterials, industrial waste treatment, and chemical pollution assessment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14201f"/><stop offset="0.55" stop-color="#1f6f68"/><stop offset="1" stop-color="#c96f2c"/></linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="50%"><stop stop-color="#fffaf0"/><stop offset="0.38" stop-color="#c5d86d"/><stop offset="1" stop-color="#1f6f68"/></radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="760" rx="48" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#fffaf0" stroke-width="1"><path d="M0 120h1200M0 240h1200M0 360h1200M0 480h1200M0 600h1200"/><path d="M160 0v760M320 0v760M480 0v760M640 0v760M800 0v760M960 0v760"/></g>

  <text x="60" y="76" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="40" font-weight="800" fill="#fffaf0">Research Directions</text>
  <text x="60" y="112" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="18" font-weight="500" fill="#fffaf0" opacity="0.9">rare earths • hydrometallurgy • environment • waste • analysis</text>

  <g fill="none" stroke="#fffaf0" stroke-width="5" opacity="0.55"><path d="M610 430 610 220M610 430 900 346M610 430 790 638M610 430 430 638M610 430 320 346"/></g>
  <circle cx="610" cy="430" r="108" fill="url(#core)" filter="url(#glow)"/><circle cx="610" cy="430" r="44" fill="#fffaf0" opacity="0.92"/>

  <g font-family="Be Vietnam Pro, Arial, sans-serif" text-anchor="middle">
    <g><circle cx="610" cy="220" r="88" fill="#fffaf0"/><text x="610" y="211" font-size="24" font-weight="750" fill="#14201f">Rare-earth</text><text x="610" y="241" font-size="21" font-weight="600" fill="#5e6b68">extraction</text></g>
    <g><circle cx="900" cy="346" r="88" fill="#fffaf0"/><text x="900" y="353" font-size="18" font-weight="700" fill="#14201f">Hydrometallurgy</text></g>
    <g><circle cx="790" cy="638" r="88" fill="#fffaf0"/><text x="790" y="629" font-size="21" font-weight="750" fill="#14201f">Nano</text><text x="790" y="658" font-size="19" font-weight="600" fill="#5e6b68">environment</text></g>
    <g><circle cx="430" cy="638" r="88" fill="#fffaf0"/><text x="430" y="629" font-size="22" font-weight="750" fill="#14201f">Waste</text><text x="430" y="658" font-size="19" font-weight="600" fill="#5e6b68">treatment</text></g>
    <g><circle cx="320" cy="346" r="88" fill="#fffaf0"/><text x="320" y="337" font-size="22" font-weight="750" fill="#14201f">Chemical</text><text x="320" y="366" font-size="19" font-weight="600" fill="#5e6b68">analysis</text></g>
  </g>
  <g fill="#c5d86d" opacity="0.9"><circle cx="518" cy="382" r="13"/><circle cx="703" cy="379" r="13"/><circle cx="565" cy="518" r="13"/><circle cx="660" cy="516" r="13"/></g>
</svg>
